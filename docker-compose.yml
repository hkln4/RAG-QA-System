services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./pdfs:/app/pdfs
      - ./faiss_index:/app/faiss_index
      - ./mlruns:/app/mlruns
    restart: unless-stopped
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1  # match the mlflow client in requirements.txt
    ports:
      - "5001:5001"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5001
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /mlruns
      --no-serve-artifacts
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Vector-DB benchmark only (rag_eval/infra); not started by a plain `docker compose up`.
  #   docker compose --profile bench up -d
  # Both get the same CPU and memory limits so the comparison is between engines.
  bench-pgvector:
    image: pgvector/pgvector:0.8.6-pg17
    profiles: ["bench"]
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    command: ["postgres", "-c", "shared_buffers=1GB"]  # room to keep table and index in memory
    ports:
      - "5434:5432"
    volumes:
      - bench_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}

  bench-qdrant:
    image: qdrant/qdrant:v1.20.0
    profiles: ["bench"]
    ports:
      - "6333:6333"
    volumes:
      - bench_qdrant:/qdrant/storage
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}

volumes:
  grafana_data:
  bench_pgdata:
  bench_qdrant: